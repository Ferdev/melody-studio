name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to melody-studio.ferdev.com
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v 2.12.0 --no-document

      - name: Load the deploy key
        env:
          KAMAL_SSH_KEY: ${{ secrets.KAMAL_SSH_KEY }}
        run: |
          eval "$(ssh-agent -a "$RUNNER_TEMP/ssh-agent.sock" -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf '%s\n' "$KAMAL_SSH_KEY" | ssh-add -

      - name: Trust the server host key
        run: |
          mkdir -p ~/.ssh
          echo "65.21.83.80 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHUx8Pnvpfq5YI/RA7gFpUw1HLeR+xWjQ2lqG06495TL" >> ~/.ssh/known_hosts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose the GitHub cache to the Docker build
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Start the database (only when it does not exist yet)
        run: kamal accessory boot postgres

      - name: Build and deploy
        run: kamal deploy

      - name: Check the live site
        run: curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 https://melody-studio.ferdev.com
